name: Compilar app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Probar el motor
        run: |
          clang++ -O2 -std=c++17 -ISource Tests/EngineTest.cpp -o engine_test
          ./engine_test

      - name: Armar Toolkit.zip (todo en la misma carpeta)
        run: |
          mkdir pkg
          cp -R build/Toolkit_artefacts/Release/Toolkit.app pkg/
          cp Instalador/Install.command Instalador/Uninstall.command pkg/
          chmod +x pkg/Install.command pkg/Uninstall.command
          codesign --force --deep --sign - pkg/Toolkit.app
          lipo -info pkg/Toolkit.app/Contents/MacOS/Toolkit
          (cd pkg && zip -ry ../Toolkit.zip .)
          unzip -l Toolkit.zip | head -20

      - name: Subir Toolkit.zip
        uses: actions/upload-artifact@v7
        with:
          path: Toolkit.zip
          archive: false
