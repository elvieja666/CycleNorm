name: Compilar app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Probar el motor
        run: |
          clang++ -O2 -std=c++17 -ISource Tests/EngineTest.cpp -o engine_test
          ./engine_test

      - name: Armar Node.zip (todo en la misma carpeta)
        run: |
          mkdir pkg
          cp -R build/Node_artefacts/Release/Node.app pkg/
          cp Instalador/Install.command Instalador/Uninstall.command pkg/
          chmod +x pkg/Install.command pkg/Uninstall.command
          codesign --force --deep --sign - pkg/Node.app
          lipo -info pkg/Node.app/Contents/MacOS/Node
          (cd pkg && zip -ry ../Node.zip .)
          unzip -l Node.zip | head -20

      - name: Subir Node.zip
        uses: actions/upload-artifact@v7
        with:
          path: Node.zip
          archive: false
